<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f3ff">
  <title>Number Guessing Game</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="game-card">
    <div class="game-icon" aria-hidden="true">🎯</div>
    <p class="eyebrow">A little challenge for you</p>
    <h1>Number Guessing Game</h1>
    <p class="instructions">I'm thinking of a number between <strong>1 and 100</strong>. Can you guess it?</p>

    <form id="guess-form">
      <label for="guess-input">Your guess</label>
      <div class="guess-controls">
        <input
          id="guess-input"
          name="guess"
          type="number"
          min="1"
          max="100"
          step="1"
          placeholder="e.g. 42"
          inputmode="numeric"
          required
          autofocus
        >
        <button class="guess-button" type="submit">Guess</button>
      </div>
    </form>

    <p id="feedback" class="feedback" role="status" aria-live="polite">Make your first guess to get started!</p>

    <div class="attempts" aria-live="polite">
      <span class="attempts-icon" aria-hidden="true">✨</span>
      <span>Attempts</span>
      <strong id="attempt-count">0</strong>
    </div>

    <button id="restart-button" class="restart-button" type="button">↻ <span>Restart game</span></button>
  </main>
</body>
</html>
