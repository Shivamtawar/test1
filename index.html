<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake Game</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game">
      <header class="game__header">
        <div>
          <p class="eyebrow">Classic arcade</p>
          <h1>Snake</h1>
        </div>
        <div class="score" aria-label="Score">
          <span class="score__label">Score</span>
          <strong id="score">0</strong>
        </div>
      </header>

      <section class="game__panel" aria-label="Snake game">
        <div id="board" class="board" role="grid" aria-label="Snake game board"></div>
        <p id="status" class="status" role="status" aria-live="polite">
          Press Start to begin.
        </p>
        <button id="start-button" class="button" type="button">Start game</button>
      </section>

      <p class="instructions">Use the arrow keys to move. Eat the food to grow.</p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
